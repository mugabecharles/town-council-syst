services:
  - type: web
    name: town-council-syst
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health.php

    envVars:
      - key: APP_ENV
        value: production
      - key: COUNCIL_NAME
        value: "Kira Town Council"
      - key: SESSION_TIMEOUT
        value: "1800"
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "3306"
