services:
  # ── PHP Web Application (Docker) ───────────────────────────────────
  - type: web
    name: town-council-syst
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /index.php

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false          # set manually in dashboard to your Render URL
      - key: COUNCIL_NAME
        value: "Kira Town Council"
      - key: SESSION_TIMEOUT
        value: "1800"
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "3306"
      # DB_HOST, DB_NAME, DB_USER, DB_PASS — set manually in dashboard
      # (from Aiven or your external MySQL provider)
